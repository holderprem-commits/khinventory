<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kyosh Account Inventory</title>
<style>
:root{
  --bg:#08090c;--panel:#101216;--panel2:#14161b;--line:#242730;
  --text:#f4f5f7;--muted:#858a96;--green:#24d36b;--orange:#f2a33a;
  --red:#ff5252;--blue:#6ea8fe;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background:
  radial-gradient(circle at top right,rgba(40,45,65,.28),transparent 35%),var(--bg);
  color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.wrapper{width:min(1450px,94%);margin:auto;padding:30px 0 45px}
.header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:13px}
.logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#171923;border:1px solid #2a2d38;font-size:19px;font-weight:900}
h1{margin:0;font-size:22px;letter-spacing:-.5px}
.subtitle{color:var(--muted);font-size:13px;margin-top:3px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  border:1px solid #303541;background:#171a21;color:#dfe2e8;border-radius:9px;
  padding:9px 13px;font-weight:700;font-size:12px
}
.btn:hover{background:#20242d;border-color:#454b59}
.btn.primary{background:#1b6f43;border-color:#2a9a5e;color:#fff}
.btn.primary:hover{background:#21844f}
.btn.danger{color:#ff8585;border-color:#552b31}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px 19px}
.stat-label{color:var(--muted);font-size:11px;margin-bottom:7px;font-weight:700;letter-spacing:.6px}
.stat-value{font-size:24px;font-weight:800}
.server{
  background:var(--panel);border:1px solid var(--line);border-radius:16px;
  overflow:hidden;margin-bottom:14px;box-shadow:0 18px 50px rgba(0,0,0,.18)
}
.server-head{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:16px 18px;border-bottom:1px solid var(--line)}
.server-title{display:flex;align-items:center;gap:12px;min-width:0}
.server-name{font-size:15px;font-weight:800}
.server-meta{font-size:11px;color:var(--muted);margin-top:3px}
.server-total{font-size:18px;font-weight:800;color:var(--orange);white-space:nowrap}
.server-actions{display:flex;gap:7px;flex-wrap:wrap}
.server-actions .btn{padding:7px 10px}
.accounts{padding:8px 12px 12px}
.account{
  display:grid;grid-template-columns:55px minmax(100px,1fr) 145px 190px auto;
  gap:10px;align-items:center;padding:11px 8px;border-bottom:1px solid #1e2128
}
.account:last-child{border-bottom:0}
.account:hover{background:#15181e}
.num{color:#6e7480;font-size:11px;font-weight:800}
.value{font-weight:800;color:#e7e9ed}
.cred{min-width:0}
.username{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.password{font-size:11px;color:#707785;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actions-small{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.small{
  border:1px solid #2c303a;background:#171a20;color:#cfd3db;border-radius:7px;
  padding:6px 8px;font-size:10px;font-weight:700
}
.small:hover{background:#20242c}
.small.red{color:#ff8585}
.empty{padding:35px 15px;text-align:center;color:var(--muted);font-size:12px}
.add-row{padding:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.capacity{font-size:11px;color:var(--muted)}
.search{
  width:280px;max-width:100%;border:1px solid #2c3039;background:#11141a;color:#fff;
  border-radius:9px;padding:9px 11px;outline:none
}
.search:focus{border-color:#555d6b}
.modal{
  position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;
  padding:20px;background:rgba(0,0,0,.74);backdrop-filter:blur(6px)
}
.modal.open{display:flex}
.card{
  width:min(600px,96vw);max-height:90vh;overflow:auto;background:#101216;
  border:1px solid #2a2e38;border-radius:16px;box-shadow:0 30px 90px rgba(0,0,0,.55)
}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-title{font-size:16px;font-weight:800}
.close{width:34px;height:34px;border-radius:9px;border:1px solid #303541;background:#171a21;color:#fff;font-size:18px}
.form{padding:18px}
.field{margin-bottom:13px}
.field label{display:block;color:#9298a4;font-size:11px;font-weight:700;margin-bottom:6px}
.field input,.field textarea{
  width:100%;border:1px solid #2c3039;background:#0d1015;color:#fff;border-radius:9px;
  padding:10px 11px;outline:none
}
.field textarea{min-height:180px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}
.field input:focus,.field textarea:focus{border-color:#596170}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.help{color:#707785;font-size:10px;line-height:1.5;margin-top:6px}
.range-box{
  background:#0b0d11;border:1px solid #252933;border-radius:10px;padding:11px 12px;
  color:#dfe2e8;font-size:12px;margin-top:8px
}
.range-box b{color:var(--orange)}
.copybox{padding:16px 18px}
.copy-preview{
  background:#0b0d11;border:1px solid #252933;border-radius:10px;padding:12px;
  white-space:pre-wrap;word-break:break-word;font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;
  max-height:50vh;overflow:auto;color:#dfe2e8
}
.toast{
  position:fixed;right:20px;bottom:20px;z-index:2000;background:#171a21;border:1px solid #363b47;
  color:#fff;border-radius:10px;padding:10px 13px;font-size:12px;box-shadow:0 12px 35px rgba(0,0,0,.35);
  opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s
}
.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:900px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .account{grid-template-columns:35px minmax(90px,1fr) 90px}
  .account .password,.account .actions-small{grid-column:2/-1}
}
@media(max-width:650px){
  .wrapper{width:96%;padding-top:20px}
  .header{align-items:flex-start;flex-direction:column}
  .stats{grid-template-columns:1fr 1fr}
  .server-head{align-items:flex-start;flex-direction:column}
  .server-actions{width:100%}
  .server-actions .btn{flex:1}
  .account{grid-template-columns:30px 1fr 75px}
}
</style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <div class="brand">
      <div class="logo">KI</div>
      <div>
        <h1>KYOSH ACCOUNT INVENTORY</h1>
        <div class="subtitle">Automatic account sorting by value · Unlimited accounts</div>
      </div>
    </div>
    <div class="actions">
      <input id="search" class="search" placeholder="Search username...">
      <button class="btn primary" onclick="addAccount()">＋ Add Account</button>
      <button class="btn" onclick="importData()">Import</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-label">SERVERS</div><div class="stat-value" id="serverCount">4</div></div>
    <div class="stat"><div class="stat-label">TOTAL ACCOUNTS</div><div class="stat-value" id="accountCount">0</div></div>
    <div class="stat"><div class="stat-label">ACCOUNT CAPACITY</div><div class="stat-value" id="slotCount">∞</div></div>
    <div class="stat"><div class="stat-label">TOTAL VALUE</div><div class="stat-value" id="grandTotal">0</div></div>
  </div>

  <div id="servers"></div>
</div>

<div class="modal" id="modal">
  <div class="card" onclick="event.stopPropagation()">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">Add Account</div>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div class="form" id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = "kyosh_account_inventory_v3";

const SERVER_DEFS = [
  {id:"server1", name:"Server 1", range:"1B - 100B", min:1e9, max:100e9},
  {id:"server2", name:"Server 2", range:"101B - 200B", min:100e9, max:200e9},
  {id:"server3", name:"Server 3", range:"201B - 500B", min:200e9, max:500e9},
  {id:"server4", name:"Server 4", range:"501B+", min:500e9, max:Infinity}
];

let state = load();
let modalAction = null;
let copyServerId = null;
let editingAccount = null;

function uid(){
  return Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
}

function emptyServers(){
  return SERVER_DEFS.map(d => ({
    id:d.id,
    name:d.name,
    range:d.range,
    accounts:[]
  }));
}

function load(){
  try{
    const x = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(Array.isArray(x) && x.length){
      return normalizeState(x);
    }

    // Migrate the previous version that used manually-created servers.
    const old = JSON.parse(localStorage.getItem("kyosh_account_inventory_v2"));
    if(Array.isArray(old)){
      return normalizeState(old);
    }
  }catch(e){}
  return emptyServers();
}

function normalizeState(source){
  const servers = emptyServers();
  const allAccounts = [];

  for(const server of Array.isArray(source) ? source : []){
    if(Array.isArray(server.accounts)){
      allAccounts.push(...server.accounts);
    }
  }

  for(const account of allAccounts){
    const value = parseAmount(account.amount);
    const target = getServerForAmount(value);
    if(target){
      target.accounts.push({
        id:account.id || uid(),
        amount:String(account.amount ?? ""),
        username:String(account.username ?? ""),
        password:String(account.password ?? ""),
        _show:false
      });
    }
  }

  return servers;
}

function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function esc(v){
  return String(v ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
    .replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

function parseAmount(value){
  if(typeof value === "number" && Number.isFinite(value)) return value;

  let s = String(value ?? "").trim().replaceAll(",","");
  if(!s) return 0;

  const m = s.match(/^(-?[\d.]+)\s*(K|M|B|T|QA|QI)?$/i);
  if(!m) return Number(s) || 0;

  const n = Number(m[1]);
  const unit = (m[2] || "").toUpperCase();
  const mult = {
    K:1e3,
    M:1e6,
    B:1e9,
    T:1e12,
    QA:1e15,
    QI:1e18
  };

  return n * (mult[unit] || 1);
}

function formatAmount(n){
  n = Number(n) || 0;

  const units = [
    [1e18,"Qi"],
    [1e15,"Qa"],
    [1e12,"T"],
    [1e9,"B"],
    [1e6,"M"],
    [1e3,"K"]
  ];

  for(const [d,u] of units){
    if(Math.abs(n) >= d){
      let v = n / d;
      let text = v >= 100
        ? v.toFixed(0)
        : v.toFixed(2).replace(/\.00$/,"").replace(/(\.\d)0$/,"$1");
      return text + u;
    }
  }

  return Math.round(n).toLocaleString();
}

function getServerForAmount(amount){
  const n = parseAmount(amount);
  if(!Number.isFinite(n) || n < 1e9) return null;

  // Boundaries:
  // 1B through 100B       -> Server 1
  // above 100B through 200B -> Server 2
  // above 200B through 500B -> Server 3
  // above 500B             -> Server 4
  if(n <= 100e9) return state.find(s=>s.id==="server1") || null;
  if(n <= 200e9) return state.find(s=>s.id==="server2") || null;
  if(n <= 500e9) return state.find(s=>s.id==="server3") || null;
  return state.find(s=>s.id==="server4") || null;
}

function getServerDefinition(id){
  return SERVER_DEFS.find(s=>s.id===id);
}

function serverTotal(server){
  return server.accounts.reduce((sum,a)=>sum+parseAmount(a.amount),0);
}

function totalAccounts(){
  return state.reduce((n,s)=>n+s.accounts.length,0);
}

function filtered(name){
  const q = document.getElementById("search").value.trim().toLowerCase();
  if(!q) return true;
  return name.toLowerCase().includes(q);
}

function render(){
  const total = totalAccounts();
  const slots = "∞";

  document.getElementById("serverCount").textContent = state.length;
  document.getElementById("accountCount").textContent = total;
  document.getElementById("slotCount").textContent = "∞";
  document.getElementById("grandTotal").textContent =
    formatAmount(state.reduce((n,s)=>n+serverTotal(s),0));

  const root = document.getElementById("servers");

  root.innerHTML = state.map(server=>{
    const visible = server.accounts.filter(a=>filtered(a.username));

    const rows = visible.length ? visible.map(a=>{
      const index = server.accounts.indexOf(a)+1;
      const shown = a._show === true;

      return `
        <div class="account">
          <div class="num">#${String(index).padStart(2,"0")}</div>

          <div class="cred">
            <div class="username">${esc(a.username)}</div>
            <div class="password">${shown ? esc(a.password) : "••••••••••"}</div>
          </div>

          <div class="value">${formatAmount(a.amount)}</div>

          <div class="password">
            ${shown ? "Password visible" : "Password hidden"}
          </div>

          <div class="actions-small">
            <button class="small" onclick="togglePassword('${server.id}','${a.id}')">
              ${shown ? "Hide" : "Show"}
            </button>
            <button class="small" onclick="editAccount('${server.id}','${a.id}')">Edit</button>
            <button class="small" onclick="copyAccount('${server.id}','${a.id}')">Copy</button>
            <button class="small red" onclick="removeAccount('${server.id}','${a.id}')">Remove</button>
          </div>
        </div>`;
    }).join("") :
    `<div class="empty">${
      document.getElementById("search").value
        ? "No matching accounts."
        : "No accounts in this server."
    }</div>`;

    const full = false;

    return `
      <section class="server">
        <div class="server-head">
          <div class="server-title">
            <div>
              <div class="server-name">${esc(server.name)}</div>
              <div class="server-meta">
                ${esc(server.range)} · ${server.accounts.length} accounts · Unlimited
              </div>
            </div>
          </div>

          <div class="server-total">
            Total Value: ${formatAmount(serverTotal(server))}
          </div>

          <div class="server-actions">
            <button class="btn primary" ${full?"disabled":""} onclick="addAccount()">
              ＋ Account
            </button>

            <button class="btn" onclick="copyEverything('${server.id}')">
              📋 Copy Everything
            </button>
          </div>
        </div>

        <div class="accounts">${rows}</div>

        <div class="add-row">
          <div class="capacity">
            Server total: <b>${formatAmount(serverTotal(server))}</b>
          </div>

          <button class="btn" ${full?"disabled":""} onclick="addAccount()">
            ＋ Add Account
          </button>
        </div>
      </section>`;
  }).join("");
}

function openModal(title,body){
  document.getElementById("modalTitle").textContent=title;
  document.getElementById("modalBody").innerHTML=body;
  document.getElementById("modal").classList.add("open");
}

function closeModal(){
  document.getElementById("modal").classList.remove("open");
  modalAction=null;
  editingAccount=null;
}

function amountPreview(){
  const input = document.getElementById("amount");
  const box = document.getElementById("rangePreview");
  if(!input || !box) return;

  const value = parseAmount(input.value);
  const server = getServerForAmount(value);

  if(!input.value.trim()){
    box.innerHTML = "Enter an amount to automatically determine the server.";
    return;
  }

  if(!server){
    box.innerHTML = `<span style="color:#ff8585">Amount must be at least 1B.</span>`;
    return;
  }

  if(server.accounts.length >= MAX_PER_SERVER && (!editingAccount || editingAccount.serverId !== server.id)){
    box.innerHTML =
      `<span style="color:#ff8585">${esc(server.name)} is full (20/20).</span>
       <br><span style="color:#707785">This amount belongs to the ${esc(server.range)} range.</span>`;
    return;
  }

  box.innerHTML =
    `Automatically assigned to <b>${esc(server.name)}</b>
     <span style="color:#707785">(${esc(server.range)})</span>`;
}

function addAccount(){
  editingAccount=null;

  openModal("Add Account",`
    <div class="field">
      <label>AMOUNT / GAME VALUE</label>
      <input id="amount" placeholder="Example: 25B" oninput="amountPreview()">
      <div class="range-box" id="rangePreview">
        Enter an amount to automatically determine the server.
      </div>
    </div>

    <div class="field">
      <label>USERNAME</label>
      <input id="username" placeholder="Roblox username">
    </div>

    <div class="field">
      <label>PASSWORD</label>
      <input id="password" type="password" placeholder="Password">
    </div>

    <div class="help">
      Accepted amount units: K, M, B, T, Qa, Qi.
      Server ranges: 1B–100B, 101B–200B, 201B–500B, 501B+.
    </div>

    <div class="form-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn primary" onclick="saveNewAccount()">Add Account</button>
    </div>`);

  setTimeout(()=>document.getElementById("amount")?.focus(),50);
}

function saveNewAccount(){
  const amount=document.getElementById("amount").value.trim();
  const username=document.getElementById("username").value.trim();
  const password=document.getElementById("password").value;

  const value=parseAmount(amount);
  const server=getServerForAmount(value);

  if(!Number.isFinite(value) || value < 1e9){
    return toast("Account value must be at least 1B.");
  }

  if(!username || !password){
    return toast("Username and password are required.");
  }

  if(!server){
    return toast("Could not determine the server.");
  }

    server.accounts.push({
    id:uid(),
    amount,
    username,
    password,
    _show:false
  });

  save();
  render();
  closeModal();
  toast(`${username} added to ${server.name}.`);
}

function editAccount(serverId,accountId){
  const s=state.find(x=>x.id===serverId);
  const a=s?.accounts.find(x=>x.id===accountId);

  if(!a)return;

  editingAccount={serverId,accountId};

  openModal("Edit Account",`
    <div class="field">
      <label>AMOUNT / GAME VALUE</label>
      <input id="amount" value="${esc(a.amount)}" oninput="amountPreview()">
      <div class="range-box" id="rangePreview">
        Current server: <b>${esc(s.name)}</b> (${esc(s.range)})
      </div>
    </div>

    <div class="field">
      <label>USERNAME</label>
      <input id="username" value="${esc(a.username)}">
    </div>

    <div class="field">
      <label>PASSWORD</label>
      <input id="password" type="password" value="${esc(a.password)}">
    </div>

    <div class="help">
      Changing the amount can automatically move this account to another server.
    </div>

    <div class="form-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn primary" onclick="saveAccountChanges('${serverId}','${accountId}')">
        Save Changes
      </button>
    </div>`);

  setTimeout(()=>amountPreview(),50);
}

function saveAccountChanges(serverId,accountId){
  const oldServer=state.find(x=>x.id===serverId);
  const account=oldServer?.accounts.find(x=>x.id===accountId);

  if(!account)return;

  const amount=document.getElementById("amount").value.trim();
  const username=document.getElementById("username").value.trim();
  const password=document.getElementById("password").value;

  const value=parseAmount(amount);
  const target=getServerForAmount(value);

  if(!Number.isFinite(value) || value < 1e9){
    return toast("Account value must be at least 1B.");
  }

  if(!username || !password){
    return toast("Username and password are required.");
  }

  if(!target){
    return toast("Could not determine the server.");
  }

  // If it stays in the same server, simply update it.
  if(target.id === oldServer.id){
    Object.assign(account,{amount,username,password});
    save();
    render();
    closeModal();
    toast("Account updated.");
    return;
  }

  // Moving to another range.
    oldServer.accounts=oldServer.accounts.filter(x=>x.id!==accountId);

  account.amount=amount;
  account.username=username;
  account.password=password;
  account._show=false;

  target.accounts.push(account);

  save();
  render();
  closeModal();
  toast(`Account moved to ${target.name}.`);
}

function removeAccount(serverId,accountId){
  const s=state.find(x=>x.id===serverId);
  if(!s)return;

  const a=s.accounts.find(x=>x.id===accountId);
  if(!a)return;

  if(!confirm(`Remove ${a.username} from ${s.name}?`))return;

  s.accounts=s.accounts.filter(x=>x.id!==accountId);
  save();
  render();
  toast("Account removed.");
}

function togglePassword(serverId,accountId){
  const s=state.find(x=>x.id===serverId);
  const a=s?.accounts.find(x=>x.id===accountId);

  if(a){
    a._show=!a._show;
    render();
  }
}

async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
    toast("Copied to clipboard.");
  }catch(e){
    const ta=document.createElement("textarea");
    ta.value=text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
    toast("Copied to clipboard.");
  }
}

function accountLine(a){
  return `(${formatAmount(parseAmount(a.amount))}) ${a.username}:${a.password}`;
}

function copyAccount(serverId,accountId){
  const s=state.find(x=>x.id===serverId);
  const a=s?.accounts.find(x=>x.id===accountId);

  if(a)copyText(accountLine(a));
}

function copyEverything(serverId){
  const s=state.find(x=>x.id===serverId);

  if(!s)return;
  if(!s.accounts.length)return toast("This server has no accounts.");

  copyServerId=serverId;

  const text=s.accounts.map(accountLine).join("\n");

  openModal(`Copy Everything — ${s.name}`,`
    <div class="copybox">
      <div class="help" style="margin-bottom:10px">
        This copies only the accounts in ${esc(s.name)}, one account per line.
      </div>

      <div class="copy-preview">${esc(text)}</div>

      <div class="form-actions">
        <button class="btn" onclick="closeModal()">Close</button>
        <button class="btn primary" onclick="copyServerNow()">
          📋 Copy Everything
        </button>
      </div>
    </div>`);
}

function copyServerNow(){
  const s=state.find(x=>x.id===copyServerId);
  if(!s)return;

  copyText(s.accounts.map(accountLine).join("\n"));
  closeModal();
}

function importData(){
  openModal("Import Accounts",`
    <div class="field">
      <label>ACCOUNT LINES</label>
      <textarea id="importText" placeholder="(25B) username:password
(150B) username2:password2
(350B) username3:password3
(750B) username4:password4"></textarea>
    </div>

    <div class="help">
      Format: (amount) username:password.
      Accounts are automatically placed into the correct server based on amount.
      Each server can contain unlimited accounts.
    </div>

    <div class="form-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn primary" onclick="runImport()">Import Accounts</button>
    </div>`);
}

function runImport(){
  const text=document.getElementById("importText").value;

  const lines=text.split(/\r?\n/)
    .map(x=>x.trim())
    .filter(Boolean);

  if(!lines.length){
    return toast("Enter at least one account.");
  }

  const parsed=[];
  const needed={
    server1:0,
    server2:0,
    server3:0,
    server4:0
  };

  for(const line of lines){
    const m=line.match(/^\(([^)]+)\)\s+([^:\s]+):(.+)$/);

    if(!m){
      return toast(`Invalid format: ${line}`);
    }

    const amount=m[1].trim();
    const username=m[2].trim();
    const password=m[3];

    const value=parseAmount(amount);
    const server=getServerForAmount(value);

    if(!Number.isFinite(value) || value < 1e9){
      return toast(`${username}: amount must be at least 1B.`);
    }

    if(!server){
      return toast(`${username}: could not determine server.`);
    }

    needed[server.id]++;

    parsed.push({
      id:uid(),
      amount,
      username,
      password,
      serverId:server.id
    });
  }

  for(const server of state){
    const count=needed[server.id] || 0;

  }

  for(const item of parsed){
    const server=state.find(s=>s.id===item.serverId);

    server.accounts.push({
      id:item.id,
      amount:item.amount,
      username:item.username,
      password:item.password,
      _show:false
    });
  }

  save();
  render();
  closeModal();
  toast(`${parsed.length} account(s) imported and sorted automatically.`);
}

function toast(message){
  const el=document.getElementById("toast");
  el.textContent=message;
  el.classList.add("show");

  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>{
    el.classList.remove("show");
  },2400);
}

document.getElementById("search").addEventListener("input",render);

document.getElementById("modal").addEventListener("click",e=>{
  if(e.target.id==="modal")closeModal();
});

document.addEventListener("keydown",e=>{
  if(e.key==="Escape")closeModal();
});

render();
</script>
